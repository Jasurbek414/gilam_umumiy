<!-- ═══ MODALS ══════════════════════════════════════════════════════════ -->

<!-- NEW CUSTOMER MODAL -->
<div id="modal-new-customer" class="fixed inset-0 z-[9999] bg-black/60 backdrop-blur-sm items-center justify-center p-4 hidden">
  <div class="bg-gray-900 border border-solid border-gray-800 rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] w-full max-w-lg overflow-hidden">
    <!-- Header -->
    <div class="flex justify-between items-center px-6 py-4 border-b border-solid border-gray-800 bg-gray-800/50">
      <h3 class="text-lg font-semibold text-white flex items-center gap-2">
        <span class="material-icons-round text-brand">person_add</span> Yangi mijoz qo'shish
      </h3>
      <button type="button" id="btn-close-customer-modal" class="text-gray-400 hover:text-white hover:bg-gray-700 p-1.5 rounded-lg border-0 outline-none focus:outline-none transition-colors cursor-pointer flex items-center justify-center">
        <span class="material-icons-round text-xl">close</span>
      </button>
    </div>
    
    <!-- Body -->
    <form id="form-new-customer" class="m-0">
      <div class="p-6 space-y-5">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">To'liq ism</label>
          <input type="text" id="new-customer-name" placeholder="Ism familiya" required autocomplete="off" class="w-full bg-[#0e0e1c] border border-solid border-gray-700/60 text-white text-sm rounded-lg focus:border-brand focus:outline-none block p-2.5 placeholder-gray-500">
        </div>
        
        <div class="flex gap-4">
          <div class="flex-1">
            <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Telefon 1</label>
            <input type="text" id="new-customer-phone1" placeholder="+998..." required autocomplete="off" class="w-full bg-[#0e0e1c] border border-solid border-gray-700/60 text-white text-sm rounded-lg focus:border-brand focus:outline-none block p-2.5 placeholder-gray-500">
          </div>
          <div class="flex-1">
            <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Telefon 2</label>
            <input type="text" id="new-customer-phone2" placeholder="+998... (ixtiyoriy)" autocomplete="off" class="w-full bg-[#0e0e1c] border border-solid border-gray-700/60 text-white text-sm rounded-lg focus:border-brand focus:outline-none block p-2.5 placeholder-gray-500">
          </div>
        </div>
        
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Manzil</label>
          <textarea id="new-customer-address" placeholder="Manzil" rows="3" class="w-full bg-[#0e0e1c] border border-solid border-gray-700/60 text-white text-sm rounded-lg focus:border-brand focus:outline-none block p-2.5 placeholder-gray-500 resize-none"></textarea>
        </div>
      </div>
      
      <!-- Footer -->
      <div class="px-6 py-4 bg-gray-800/80 border-t border-solid border-gray-800 flex justify-end gap-3">
        <button type="button" id="btn-cancel-customer" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium rounded-lg border-0 outline-none focus:outline-none transition-colors cursor-pointer">
          Bekor qilish
        </button>
        <button type="submit" class="px-4 py-2 bg-brand hover:bg-brand-dark text-white text-sm font-medium rounded-lg border-0 outline-none focus:outline-none shadow-sm shadow-brand/10 transition-all flex items-center gap-2 cursor-pointer">
          <span class="material-icons-round text-sm">save</span> Saqlash
        </button>
      </div>
    </form>
  </div>
</div>


<!-- ADD SIP MODAL -->
<div id="modal-add-sip" class="fixed inset-0 z-[9999] bg-black/60 backdrop-blur-sm items-center justify-center p-4 hidden">
  <div class="bg-gray-900 border border-solid border-gray-800 rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] w-full max-w-lg overflow-hidden">
    <!-- Header -->
    <div class="flex justify-between items-center px-6 py-4 border-b border-solid border-gray-800 bg-gray-800/50">
      <h3 class="text-lg font-semibold text-white flex items-center gap-2">
        <span class="material-icons-round text-brand">phone_in_talk</span> Yangi SIP Liniya
      </h3>
      <button onclick="window.Utils.hideModal('modal-add-sip')" class="text-gray-400 hover:text-white hover:bg-gray-700 p-1.5 rounded-lg border-0 outline-none focus:outline-none transition-colors cursor-pointer flex items-center justify-center">
        <span class="material-icons-round text-xl">close</span>
      </button>
    </div>
    
    <!-- Body -->
    <div class="p-6 space-y-5">
      <div class="flex gap-4">
        <div class="flex-1">
          <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Kampaniya</label>
          <select id="sip-campaign" class="w-full bg-[#0e0e1c] border border-solid border-gray-700/60 text-white text-sm rounded-lg focus:border-brand focus:outline-none block p-2.5 appearance-none">
            <option value="Umumiy Kampaniya" selected>Umumiy Kampaniya</option>
          </select>
        </div>
        <div class="flex-1">
          <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Nomi (ixtiyoriy)</label>
          <input type="text" id="sip-name" placeholder="Asosiy liniya" autocomplete="off" class="w-full bg-[#0e0e1c] border border-solid border-gray-700/60 text-white text-sm rounded-lg focus:border-brand focus:outline-none block p-2.5 placeholder-gray-500">
        </div>
      </div>
      
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">PBX Server (IP yoki Domen)</label>
        <input type="text" id="sip-domain" placeholder="Masalan: 10.100.100.1 yoki 10.100.100.1:8090" autocomplete="off" class="w-full bg-[#0e0e1c] border border-solid border-gray-700/60 text-white text-sm rounded-lg focus:border-brand focus:outline-none block p-2.5 placeholder-gray-500">
        <p class="mt-2 text-[11px] text-gray-500 flex items-start gap-1">
          <span class="material-icons-round text-[13px] text-brand shrink-0">info</span>
          Agar port kiritilmasa avtomatik 8088 olinadi. Maxsus port uchun IP:PORT (masalan 192.168.1.1:8090) shaklida kiriting.
        </p>
      </div>
      
      <div class="flex gap-4">
        <div class="flex-1">
          <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Extension (Raqam)</label>
          <input type="text" id="sip-extension" placeholder="101" autocomplete="off" class="w-full bg-[#0e0e1c] border border-solid border-gray-700/60 text-white text-sm rounded-lg focus:border-brand focus:outline-none block p-2.5 placeholder-gray-500">
        </div>
        <div class="flex-1">
          <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Username (Auth)</label>
          <input type="text" id="sip-username" placeholder="101 (standart)" autocomplete="off" class="w-full bg-[#0e0e1c] border border-solid border-gray-700/60 text-white text-sm rounded-lg focus:border-brand focus:outline-none block p-2.5 placeholder-gray-500">
          <p class="mt-1 text-[10px] text-gray-500">Bo'sh qolsa, Extension ishlatiladi</p>
        </div>
      </div>
      
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Parol (Secret)</label>
        <input type="password" id="sip-password" placeholder="SIP parol" autocomplete="off" class="w-full bg-[#0e0e1c] border border-solid border-gray-700/60 text-white text-sm rounded-lg focus:border-brand focus:outline-none block p-2.5 placeholder-gray-500">
      </div>
      
      <div class="flex items-end gap-4">
        <div class="flex-1">
          <label class="block text-xs font-medium text-gray-400 mb-1.5 uppercase tracking-wider">Transport</label>
          <div class="relative">
            <select id="sip-transport" class="w-full bg-[#0e0e1c] border border-solid border-gray-700/60 text-white text-sm rounded-lg focus:border-brand focus:outline-none block p-2.5 appearance-none">
              <option value="ws" selected>WS (Lokal tarmoq)</option>
              <option value="wss">WSS (Internet/SSL)</option>
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none text-gray-400">
              <span class="material-icons-round text-sm">expand_more</span>
            </div>
          </div>
        </div>
        <div class="flex-1 pb-2 pl-2">
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="sip-autoconnect" checked class="sr-only peer">
            <div class="w-9 h-5 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-brand shadow-inner"></div>
            <span class="ml-3 text-sm font-medium text-gray-300">Avto-ulanish</span>
          </label>
        </div>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="px-6 py-4 bg-gray-800/80 border-t border-solid border-gray-800 flex justify-end gap-3">
      <button onclick="window.Utils.hideModal('modal-add-sip')" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium rounded-lg border-0 outline-none focus:outline-none transition-colors cursor-pointer">
        Bekor qilish
      </button>
      <button onclick="window.SipClient.saveAccount()" class="px-4 py-2 bg-brand hover:bg-brand-dark text-white text-sm font-medium rounded-lg border-0 outline-none focus:outline-none shadow-sm shadow-brand/10 transition-all flex items-center gap-2 cursor-pointer">
        <span class="material-icons-round text-sm">link</span> Saqlash va Ulash
      </button>
    </div>
  </div>
</div>


<!-- ORDER DETAILS MODAL -->

    <!-- Header -->
    <div class="flex justify-between items-center px-6 py-4 border-b border-solid border-gray-800 bg-gray-800/50">
      <h3 class="text-lg font-semibold text-white flex items-center gap-2">
        <span class="material-icons-round text-brand">receipt_long</span> Buyurtma Tafsilotlari
      </h3>
      <button onclick="window.Utils.hideModal('modal-order-details')" class="text-gray-400 hover:text-white hover:bg-gray-700 p-1.5 rounded-lg border-0 outline-none focus:outline-none transition-colors cursor-pointer flex items-center justify-center">
        <span class="material-icons-round text-xl">close</span>
      </button>
    </div>
    
    <!-- Body -->
    <div class="p-6 overflow-y-auto max-h-[60vh] text-gray-300">
      <div id="order-details-content" class="space-y-4"></div>
    </div>
    
    <!-- Footer -->
    <div class="px-6 py-4 bg-gray-800/80 border-t border-solid border-gray-800 flex justify-end gap-3">
      <button onclick="window.Utils.hideModal('modal-order-details')" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium rounded-lg border-0 outline-none focus:outline-none transition-colors cursor-pointer">
        Yopish
      </button>
    </div>
  </div>
</div>
