<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gilam Operator</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Google Fonts: Inter was removed for eye comfort on Windows screens -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="tailwind.css">
</head>
<body>

  <!-- ═══ COMPONENT CONTAINERS ═════════════════════════════════════════ -->
  <!-- Komponentlar component-loader.js orqali avtomatik yuklanadi -->

  <div id="app-root"></div>

  <!-- TOAST NOTIFICATIONS -->
  <div id="toast-container"></div>

  <!-- AUDIO -->
  <audio id="ringtone" loop preload="auto">
    <source src="assets/ringtone.wav" type="audio/wav">
  </audio>

  <!-- ═══ MAP MODAL ═══════════════════════════════════════════════════ -->
  <!-- ═══ MAP MODAL ═══════════════════════════════════════════════════ -->
  <div id="map-modal" class="fixed inset-0 z-[9999] bg-black/60 backdrop-blur-sm items-center justify-center p-4 hidden">
    <div class="bg-gray-900 border border-solid border-gray-800 rounded-2xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] w-full max-w-2xl h-[70vh] max-h-[550px] flex flex-col overflow-hidden">
      <!-- Header -->
      <div class="flex justify-between items-center px-6 py-4 border-b border-solid border-gray-800 bg-gray-800/50">
        <h3 class="text-lg font-semibold text-white flex items-center gap-2">
          <span class="material-icons-round text-brand">location_on</span> Lokatsiyani tanlang
        </h3>
        <button id="map-modal-close" class="text-gray-400 hover:text-white hover:bg-gray-700 p-1.5 rounded-lg border-0 outline-none focus:outline-none transition-colors cursor-pointer flex items-center justify-center">
          <span class="material-icons-round text-xl">close</span>
        </button>
      </div>
      
      <!-- Body (Map container) -->
      <div id="map-container" class="flex-grow min-h-0 bg-[#0e0e1c]"></div>
      
      <!-- Footer -->
      <div class="px-6 py-4 bg-gray-800/80 border-t border-solid border-gray-800 flex justify-between items-center gap-3">
        <div class="flex items-center gap-1.5 text-xs text-gray-400 font-semibold">
          <span class="material-icons-round text-sm text-brand">gps_fixed</span>
          <span id="map-coords-text">Xaritadan joy tanlang</span>
        </div>
        <div class="flex gap-2">
          <button id="map-cancel" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium rounded-lg border-0 outline-none focus:outline-none transition-colors cursor-pointer">
            Bekor
          </button>
          <button id="map-confirm" class="px-4 py-2 bg-brand hover:bg-brand-dark text-white text-sm font-medium rounded-lg border-0 outline-none focus:outline-none shadow-sm shadow-brand/10 transition-all flex items-center gap-2 cursor-pointer">
            <span class="material-icons-round text-sm">check</span> Tasdiqlash
          </button>
        </div>
      </div>
    </div>
  </div>



  <!-- ═══ SCRIPTS ══════════════════════════════════════════════════════ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="node_modules/socket.io-client/dist/socket.io.js"></script>
  <script src="src/js/component-loader.js"></script>
  <script src="src/js/utils.js"></script>
  <script src="src/js/api.js"></script>
  <script src="src/js/ui.js"></script>
  <script src="src/js/sip-client.js"></script>
  <script src="src/js/crm.js"></script>
  <script src="src/js/settings.js"></script>
  <script src="src/js/chat.js"></script>
  <script src="src/js/driver-map.js"></script>
  <script src="src/js/orders.js"></script>
  <script src="src/js/app.js"></script>

</body>
</html>
